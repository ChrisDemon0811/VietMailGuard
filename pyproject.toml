[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vietmailguard"
version = "2.0.0"
description = "Bilingual English/Vietnamese email classification and security analysis system"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "production_artifact: requires the frozen models/v2_bilingual/production_pipeline.joblib release artifact",
    "trec06c_real: optional integration smoke test requiring the configured 2025-123.zip archive",
]
